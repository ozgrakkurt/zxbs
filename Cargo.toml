[package]
name = "zxbs"
version = "1.0.0"
edition = "2024"

[dependencies]
serde_json = "1"
num_cpus = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crossbeam-channel = "0.5"
rand = { version = "0.10.2", features = ["thread_rng"] }

[dev-dependencies]
libc = "0.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
