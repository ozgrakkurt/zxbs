[package]
name = "zxbs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
num_cpus = "1"
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3"

[dev-dependencies]
rand = { version = "0.10.2", features = ["thread_rng"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
