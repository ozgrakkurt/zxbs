[package]
name = "zxbs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = { version = "0.10.2", features = ["thread_rng"] }

[dependencies.zxbs]
path = ".."

[[bin]]
name = "fuzz_build"
path = "fuzz_targets/fuzz_build.rs"
test = false
doc = false
bench = false
