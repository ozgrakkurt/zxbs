[package]
name = "zxbs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = { version = "0.10.2", features = ["thread_rng"] }
serde_json = "1"

[dependencies.zxbs]
path = ".."

[[bin]]
name = "fuzz_build"
path = "fuzz_targets/fuzz_build.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wal"
path = "fuzz_targets/fuzz_wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_graph"
path = "fuzz_targets/fuzz_graph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_deep_hash"
path = "fuzz_targets/fuzz_deep_hash.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_prune"
path = "fuzz_targets/fuzz_prune.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parsers"
path = "fuzz_targets/fuzz_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_tracer"
path = "fuzz_targets/fuzz_tracer.rs"
test = false
doc = false
bench = false
